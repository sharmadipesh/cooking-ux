name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate references and package integrity
        run: python -B laws-of-ux-skill/scripts/validate.py
      - name: Run integrity and packaging regressions
        run: python -B -m unittest discover -s laws-of-ux-skill/tests -p "test_*.py" -v
      - name: Verify downloadable ZIP matches source
        run: python -B laws-of-ux-skill/scripts/package.py --check

      - name: Validate dedicated audit skill
        run: python -B ux-audit-skill/scripts/validate.py
      - name: Run audit report and package regressions
        run: python -B -m unittest discover -s ux-audit-skill/tests -p "test_*.py" -v
      - name: Verify standalone audit archive
        run: python -B ux-audit-skill/scripts/package.py --check

  browser:
    name: Sandbox browser acceptance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laws-of-ux-skill/tests/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: laws-of-ux-skill/tests/browser/package-lock.json
      - name: Install optional test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise completed reference fixtures
        run: npm test -- --report "$RUNNER_TEMP/ux-browser-results.json" --screenshots "$RUNNER_TEMP/ux-screenshots"
      - name: Verify success assertion rejects uncertainty
        run: npm run test:oracle
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-browser-evidence
          path: |
            ${{ runner.temp }}/ux-browser-results.json
            ${{ runner.temp }}/ux-screenshots/
