<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teamline records</title>
<style>
:root { font-family: system-ui, sans-serif; color: #182332; background: #f4f6f9; --accent: #1248aa; --space: 1rem; }
* { box-sizing: border-box; }
body { margin: 0; padding: var(--space); line-height: 1.5; }
main { max-width: 50rem; margin: 2rem auto; padding: 1.5rem; background: white; border-radius: .5rem; }
h1 { margin: 0; line-height: 1.2; overflow-wrap: anywhere; } h2 { margin: 0; font-size: 1.25rem; }
p { margin: .5rem 0 var(--space); } .intro, #help { color: #475569; }
input, button, a { font: inherit; } a { color: var(--accent); }
input, button, .action { max-width: 100%; min-width: 0; overflow-wrap: anywhere; min-height: 2.75rem; padding: .6rem .85rem; border-radius: .25rem; }
input { width: 100%; border: 1px solid #64748b; background: white; color: inherit; }
button { border: 1px solid var(--accent); background: var(--accent); color: white; cursor: pointer; }
button.secondary { background: white; color: var(--accent); }
.action { display: inline-flex; align-items: center; }
label { display: block; font-weight: 600; margin-bottom: .35rem; }
.hint { font-size: .875rem; color: #475569; margin: 0 0 .5rem; }
.search-controls { display: flex; align-items: flex-start; gap: .5rem; flex-wrap: wrap; }
.search-controls input { flex: 1 1 16rem; min-width: 0; }
#filters { margin: 1.5rem 0; }
.results-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--space); flex-wrap: wrap; }
#results { border-top: 1px solid #cbd5e1; padding-top: var(--space); }
#status { font-weight: 600; overflow-wrap: anywhere; }
#help { overflow-wrap: anywhere; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
td, th { padding: .7rem; text-align: left; border-bottom: 1px solid #cbd5e1; vertical-align: top; overflow-wrap: anywhere; }
th { background: #f4f6f9; }
:focus-visible { outline: 3px solid #164baa; outline-offset: 3px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
@media (max-width: 36rem) { body { padding: .5rem; } main { margin: .5rem auto; padding: var(--space); } .search-controls input { flex-basis: 100%; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Team records</h1>
    <p class="intro">Find records across your team.</p>
    <a href="/records/new" id="create" class="action" hidden>Create record</a>
  </header>
  <form id="filters" role="search">
    <label for="query">Find records</label>
    <p class="hint" id="search-hint">Enter a search, or leave blank to show all records.</p>
    <div class="search-controls">
      <input id="query" type="search" name="q" aria-describedby="search-hint">
      <button type="submit">Search</button>
      <button type="button" id="clear" class="secondary" hidden>Clear search</button>
    </div>
  </form>
  <section id="results" aria-labelledby="results-title">
    <div class="results-heading">
      <h2 id="results-title">Results</h2>
      <a href="/api/export" id="export" class="action" hidden>Export results</a>
    </div>
    <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <p id="help" hidden></p>
    <button type="button" id="retry" class="secondary" hidden>Try again</button>
    <div class="table-scroll" id="records-table" role="region" aria-label="Team records table" tabindex="0" hidden>
      <table aria-describedby="status">
        <caption class="sr-only">Team records</caption>
        <thead><tr><th scope="col">Name</th><th scope="col">Team</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
<script>
// Existing contracts: GET /api/records?q=<query>; GET /api/export?q=<same query>.
// URL query key q must hydrate on load and remain navigable via browser back/forward.
// GET results: 200 {items:[{name,team}], permissions:{canCreate:boolean}}; 403; or 503.
// Create route /records/new is authorized only by a successful response with canCreate=true.
// Sandbox requests are intercepted by the browser tests; no real backend is provided.
const input = document.querySelector('#query');
const form = document.querySelector('#filters');
const status = document.querySelector('#status');
const help = document.querySelector('#help');
const table = document.querySelector('#records-table');
const body = document.querySelector('tbody');
const create = document.querySelector('#create');
const exportLink = document.querySelector('#export');
const clear = document.querySelector('#clear');
const retry = document.querySelector('#retry');
let activeQuery = '';
let requestId = 0;

function syncClear() { clear.hidden = input.value === '' && activeQuery === ''; }
function scope(q) { return q === '' ? 'all records' : 'search “' + q + '”'; }
function message(summary, detail = '') {
  status.textContent = summary;
  help.textContent = detail;
  help.hidden = detail === '';
}
function hideAction(link) {
  link.hidden = true;
  link.removeAttribute('href');
}
async function load(q) {
  const id = ++requestId;
  activeQuery = q;
  syncClear();
  hideAction(create);
  hideAction(exportLink);
  retry.hidden = true;
  table.hidden = true;
  body.replaceChildren();
  table.setAttribute('aria-busy', 'true');
  message('Loading ' + scope(q) + '…');
  try {
    const response = await fetch('/api/records?q=' + encodeURIComponent(q));
    if (id !== requestId) return;
    if (response.status === 403) {
      message('You don’t have access to these records.', 'Contact your team administrator if you need access. Requested scope: ' + scope(q) + '.');
      return;
    }
    if (response.status !== 200) throw new Error('Records unavailable');
    const data = await response.json();
    if (id !== requestId) return;
    if (!data || !Array.isArray(data.items) || !data.items.every(item => item && typeof item.name === 'string' && typeof item.team === 'string')) {
      throw new Error('Invalid records response');
    }
    if (data.permissions && data.permissions.canCreate === true) {
      create.href = '/records/new';
      create.hidden = false;
    }
    if (data.items.length === 0) {
      message(q === '' ? 'No team records yet.' : 'No records match “' + q + '”.',
        q !== '' ? 'Edit your search or clear it to show all records.' :
        create.hidden ? 'Records will appear here when they are available to your team.' : 'Create a record to get started.');
      return;
    }
    const rows = document.createDocumentFragment();
    for (const item of data.items) {
      const row = document.createElement('tr');
      for (const value of [item.name, item.team]) {
        const cell = document.createElement('td');
        cell.textContent = value;
        row.append(cell);
      }
      rows.append(row);
    }
    body.replaceChildren(rows);
    message(data.items.length + (data.items.length === 1 ? ' record' : ' records') + ' · ' + scope(q));
    table.hidden = false;
    exportLink.href = '/api/export?q=' + encodeURIComponent(q);
    exportLink.hidden = false;
  } catch (error) {
    if (id !== requestId) return;
    hideAction(create);
    hideAction(exportLink);
    message('Couldn’t load ' + scope(q) + '.', 'Your search is kept. Try again, or edit the search.');
    retry.hidden = false;
  } finally {
    if (id === requestId) table.setAttribute('aria-busy', 'false');
  }
}
function navigate(q) {
  const url = new URL(location.href);
  url.searchParams.set('q', q);
  if (url.href !== location.href) history.pushState({}, '', url);
  load(q);
}
function loadFromUrl() {
  input.value = new URLSearchParams(location.search).get('q') || '';
  load(input.value);
}
form.addEventListener('submit', event => { event.preventDefault(); navigate(input.value); });
input.addEventListener('input', syncClear);
clear.addEventListener('click', () => { input.value = ''; input.focus(); navigate(''); });
retry.addEventListener('click', () => { input.focus(); load(activeQuery); });
window.addEventListener('popstate', loadFromUrl);
loadFromUrl();
</script>
</body>
</html>
